[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b-xssrf"
version = "7.0.0"
description = "B-XSSRF v7 — End-to-End Automated Penetration Testing & Security Auditing Framework for Android and Backend Infrastructure"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mazen El-Gammal", email = "mazen.elgammal@example.com"}
]
maintainers = [
    {name = "Mazen El-Gammal", email = "mazen.elgammal@example.com"}
]
keywords = [
    "security",
    "penetration-testing",
    "android",
    "mobile-security",
    "vulnerability-assessment",
    "ssrf",
    "xss",
    "frida",
    "static-analysis",
    "dynamic-analysis"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Testing"
]
requires-python = ">=3.10"
dependencies = [
    "androguard>=3.4.0",
    "rich>=13.7.0",
    "python-nmap>=0.7.1",
    "requests>=2.31.0",
    "frida-tools>=12.0.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
    "types-requests>=2.31.0",
]
full = [
    "nuclei-sdk>=0.1.0",
    "subfinder>=0.1.0",
]

[project.scripts]
b-xssrf = "main:main"
bxssrf = "main:main"

[project.urls]
Homepage = "https://github.com/mazen-elgammal10/b-xssrf-framework"
Repository = "https://github.com/mazen-elgammal10/b-xssrf-framework"
Issues = "https://github.com/mazen-elgammal10/b-xssrf-framework/issues"
Documentation = "https://github.com/mazen-elgammal10/b-xssrf-framework/wiki"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = [
    "S101", # assert used (ok in tests)
    "T201", # print used (ok in CLI)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "frida_hook.js",
    "attack.svg",
    "attack.xml",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[[tool.pre-commit-hooks]]
id = "ruff"
name = "Ruff Lint"
entry = "ruff check"
language = "system"
types = ["python"]

[[tool.pre-commit-hooks]]
id = "ruff-format"
name = "Ruff Format"
entry = "ruff format"
language = "system"
types = ["python"]

[[tool.pre-commit-hooks]]
id = "mypy"
name = "MyPy Type Check"
entry = "mypy"
language = "system"
types = ["python"]